<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img">
  <defs>
    <radialGradient id="bgp" cx="50%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#0f3218"/>
      <stop offset="100%" stop-color="#030c06"/>
    </radialGradient>
    <linearGradient id="steelp" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9db3a2"/>
      <stop offset="50%" stop-color="#5f7a66"/>
      <stop offset="100%" stop-color="#26352a"/>
    </linearGradient>
    <linearGradient id="goldp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6d1c"/>
      <stop offset="50%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>
    <filter id="glowp" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="rimp" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="grainp" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="p"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bgp)"/>
  <ellipse cx="320" cy="300" rx="230" ry="240" fill="#4caf6e" opacity=".16" filter="url(#rimp)"/>
  <text x="40" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="800" fill="#7de3a4" text-anchor="start" opacity=".85">THE ROUTE A LEAD TAKES</text>
  <path d="M40 66 L600 66" stroke="#4caf6e" stroke-width="1" opacity=".2"/>
  <path d="M150 110 L150 542" stroke="#26352a" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 110 L150 542" stroke="#4caf6e" stroke-width="2.5" stroke-linecap="round" opacity=".55" stroke-dasharray="14 18"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2.4s" repeatCount="indefinite"/></path>
  <circle cx="150" cy="110" r="38" fill="#4caf6e" opacity=".18" filter="url(#glowp)"/>
  <circle cx="150" cy="110" r="26" fill="#08160d" stroke="#4caf6e" stroke-width="2.6"/>
  <g transform="translate(150,110)"><path d="M-9 0 L5 0 M0 -7 L7 0 L0 7" stroke="#7de3a4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M184 110 L212 110" stroke="#4caf6e" stroke-width="1.6" opacity=".5"/>
  <circle cx="212" cy="110" r="3" fill="#4caf6e" opacity=".8"/>
  <text x="228" y="108" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1">Lead arrives</text>
  <text x="228" y="132" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".5">call, form or text</text>
  <circle cx="150" cy="218" r="38" fill="#4caf6e" opacity=".18" filter="url(#glowp)"/>
  <circle cx="150" cy="218" r="26" fill="#08160d" stroke="#4caf6e" stroke-width="2.6"/>
  <g transform="translate(150,218)"><path d="M-8 0 L-2 6 L8 -6" stroke="#7de3a4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M184 218 L212 218" stroke="#4caf6e" stroke-width="1.6" opacity=".5"/>
  <circle cx="212" cy="218" r="3" fill="#4caf6e" opacity=".8"/>
  <text x="228" y="216" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1">Qualified</text>
  <text x="228" y="240" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".5">the right questions asked</text>
  <circle cx="150" cy="326" r="38" fill="#4caf6e" opacity=".18" filter="url(#glowp)"/>
  <circle cx="150" cy="326" r="26" fill="#08160d" stroke="#4caf6e" stroke-width="2.6"/>
  <g transform="translate(150,326)"><ellipse cx="0" cy="-6" rx="9" ry="3.5" fill="none" stroke="#7de3a4" stroke-width="2.2"/><path d="M-9 -6 L-9 6 Q0 10 9 6 L9 -6" fill="none" stroke="#7de3a4" stroke-width="2.2"/></g>
  <path d="M184 326 L212 326" stroke="#4caf6e" stroke-width="1.6" opacity=".5"/>
  <circle cx="212" cy="326" r="3" fill="#4caf6e" opacity=".8"/>
  <text x="228" y="324" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1">Into the CRM</text>
  <text x="228" y="348" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".5">logged, tagged, assigned</text>
  <circle cx="150" cy="434" r="38" fill="#4caf6e" opacity=".18" filter="url(#glowp)"/>
  <circle cx="150" cy="434" r="26" fill="#08160d" stroke="#4caf6e" stroke-width="2.6"/>
  <g transform="translate(150,434)"><path d="M8 -3 A8 8 0 1 1 3 -7" stroke="#7de3a4" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M8 -8 L8 -2 L2 -2" stroke="#7de3a4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M184 434 L212 434" stroke="#4caf6e" stroke-width="1.6" opacity=".5"/>
  <circle cx="212" cy="434" r="3" fill="#4caf6e" opacity=".8"/>
  <text x="228" y="432" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1">Followed up</text>
  <text x="228" y="456" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".5">until they answer</text>
  <circle cx="150" cy="542" r="42" fill="#D4AF37" opacity=".18" filter="url(#glowp)"/>
  <circle cx="150" cy="542" r="30" fill="#08160d" stroke="#D4AF37" stroke-width="2.6"/>
  <g transform="translate(150,542)"><path d="M0 -9 L2.6 -3 L9 -2.4 L4.2 2 L5.6 8.4 L0 5.2 L-5.6 8.4 L-4.2 2 L-9 -2.4 L-2.6 -3 Z" fill="#D4AF37"/></g>
  <path d="M188 542 L212 542" stroke="#D4AF37" stroke-width="1.6" opacity=".5"/>
  <circle cx="212" cy="542" r="3" fill="#D4AF37" opacity=".8"/>
  <text x="228" y="540" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1">Booked</text>
  <text x="228" y="564" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".5">on your calendar</text>
  <rect x="228" y="576" width="112" height="4" rx="2" fill="url(#goldp)" opacity=".9"/>
  <path d="M40 600 L600 600" stroke="#4caf6e" stroke-width="1" opacity=".2"/>
  <text x="40" y="624" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" opacity=".45">Every step runs whether you are free or not.</text>
  <rect width="640" height="640" filter="url(#grainp)" opacity=".05" style="mix-blend-mode:overlay"/>
</svg>

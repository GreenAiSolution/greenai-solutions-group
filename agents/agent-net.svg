<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 146 432 576" width="432" height="576" role="img">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#0f3218"/>
      <stop offset="100%" stop-color="#040d07"/>
    </radialGradient>

    <linearGradient id="hull5" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%"   stop-color="#6f9a9c"/>
      <stop offset="45%"  stop-color="#3c6366"/>
      <stop offset="100%" stop-color="#12292d"/>
    </linearGradient>

    <linearGradient id="hullv5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6f9a9c"/>
      <stop offset="60%"  stop-color="#3c6366"/>
      <stop offset="100%" stop-color="#12292d"/>
    </linearGradient>

    <linearGradient id="face5" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#0c1a10"/>
      <stop offset="100%" stop-color="#040a06"/>
    </linearGradient>

    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8a6d1c"/>
      <stop offset="50%"  stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>

    <linearGradient id="panel5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3FD0C3" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#3FD0C3" stop-opacity=".08"/>
    </linearGradient>

    <!-- rim light spilling around the silhouette -->
    <filter id="rim5" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow5" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- fine matte grain so the plating doesn't read as flat vector fill -->
    <filter id="grain5" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="crop5"><rect width="640" height="854" rx="0"/></clipPath>
  </defs>
  <rect width="640" height="854" fill="url(#bg5)"/>
  <!-- back rim glow -->
  <ellipse cx="320" cy="300" rx="190" ry="205" fill="#4caf6e" opacity=".30" filter="url(#rim5)"/>
  <ellipse cx="320" cy="330" rx="120" ry="130" fill="#7de3a4" opacity=".18" filter="url(#rim5)"/>
  <!-- neck, behind the shoulders -->
  <rect x="268" y="536" width="104" height="72" rx="16" fill="#26352a"/>
  <rect x="278" y="548" width="84" height="11" rx="5.5" fill="#5f7a66" opacity=".85"/>
  <rect x="278" y="566" width="84" height="11" rx="5.5" fill="#5f7a66" opacity=".85"/>
  <rect x="278" y="584" width="84" height="11" rx="5.5" fill="#5f7a66" opacity=".85"/>


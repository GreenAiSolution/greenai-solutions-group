<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>OG card source — render at 1200x630</title>
<!-- Source for og-card.jpg. Render: chrome --headless=old --window-size=1200,630
     --screenshot art/og-card.src.html, then convert to jpg. Not linked from the site. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  .card{position:relative;width:100vw;height:100vh;background:#030805;font-family:Inter,sans-serif;overflow:hidden}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%}
  .veil{position:absolute;inset:0;background:
      linear-gradient(100deg,rgba(2,6,4,.96) 0%,rgba(2,6,4,.88) 42%,rgba(2,6,4,.35) 72%,rgba(2,6,4,.18) 100%)}
  .inner{position:absolute;inset:0;padding:54px 62px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .mark{width:44px;height:44px;border-radius:11px;background:linear-gradient(140deg,#1a5c2a,#7de3a4);
      display:grid;place-items:center;font:800 20px Inter;color:#04180c}
  .brand .name{font:800 21px/1 Inter;letter-spacing:.01em;color:#fff}
  .brand .name i{font-style:normal;color:#e7c85f}
  .brand .sub{font:700 10px/1 Inter;letter-spacing:.26em;color:rgba(255,255,255,.55);margin-top:5px}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:66px;line-height:1.0;
     letter-spacing:-.03em;color:#fff;max-width:14ch}
  h1 em{font-style:italic;color:#e7c85f}
  .sub2{margin-top:18px;font:400 20px/1.5 Inter;color:rgba(255,255,255,.82);max-width:40ch}
  .foot{display:flex;align-items:center;gap:22px}
  .pill{display:inline-flex;align-items:baseline;gap:9px;padding:13px 22px;border-radius:100px;
        background:#e7c85f;color:#0a1c10;font:800 23px Inter;letter-spacing:-.01em}
  .pill span{font:700 14px Inter;opacity:.72}
  .meta{font:600 16px/1.5 Inter;color:rgba(255,255,255,.66)}
  .meta b{display:block;color:#fff;font-weight:700}
  .rule{position:absolute;left:0;right:0;bottom:0;height:5px;
        background:linear-gradient(90deg,#e7c85f,#7de3a4)}
</style></head>
<body><div class="card">
  <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b07"/><stop offset=".6" stop-color="#061c22"/><stop offset="1" stop-color="#0A3F4A"/></linearGradient>
      <radialGradient id="pw" cx="48%" cy="61%" r="72%"><stop offset="0" stop-color="#7fe8de"/><stop offset=".35" stop-color="#3FD0C3"/><stop offset=".8" stop-color="#0A3F4A"/><stop offset="1" stop-color="#072E37"/></radialGradient>
      <radialGradient id="pl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3FD0C3" stop-opacity=".5"/><stop offset="1" stop-color="#3FD0C3" stop-opacity="0"/></radialGradient>
      <filter id="sf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    </defs>
    <rect width="1200" height="630" fill="url(#sky)"/>
    <g fill="#fff" opacity=".75"><circle cx="120" cy="60" r="1.4"/><circle cx="420" cy="40" r="1"/><circle cx="760" cy="70" r="1.4"/><circle cx="1040" cy="50" r="1.2"/><circle cx="900" cy="140" r="1"/><circle cx="1140" cy="160" r="1.2"/></g>

    <rect x="0" y="380" width="1200" height="250" fill="#05110f"/>

    <path d="M640 470 Q630 420 700 412 L1080 404 Q1160 410 1170 460 L1176 560 Q1170 600 1110 604 L700 608 Q646 604 640 560 Z" fill="#c9d7d6" opacity=".18"/>
    <path d="M648 474 Q640 428 704 420 L1076 412 Q1150 418 1158 464 L1164 556 Q1158 592 1104 596 L704 600 Q654 596 648 556 Z" fill="url(#pw)"/>
    <g fill="none" stroke="#dffbf7" stroke-width="2" opacity=".35" stroke-linecap="round"><path d="M690 470 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M680 520 q30 12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/><path d="M700 565 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/></g>
    <circle cx="900" cy="535" r="11" fill="#fff" opacity=".9"/>
    <g fill="#03100c"><path d="M1130 440 Q1136 330 1108 250" stroke="#03100c" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M1108 250 Q1040 226 990 262 Q1060 246 1108 264 Z"/><path d="M1108 250 Q1070 180 1030 160 Q1090 210 1114 254 Z"/><path d="M1108 250 Q1140 170 1200 150 Q1140 210 1116 254 Z"/><path d="M1108 250 Q1180 236 1240 270 Q1170 250 1118 262 Z"/></g>
  </svg>
  <div class="veil"></div>
  <div class="inner">
    <div class="brand">
      <div class="mark">G</div>
      <div><div class="name">Green<i>AI</i></div><div class="sub">SOLUTIONS TEAM</div></div>
    </div>
    <div>
      <h1>Three AI employees for <em>pool companies.</em></h1>
      <p class="sub2">NET catches every lead in 8 seconds. BALANCE keeps every customer. PUMP keeps the money moving. Built for your company.</p>
    </div>
    <div class="foot">
      <div class="pill">$497 &middot; $347 &middot; $297<span>/month each</span></div>
      <div class="meta"><b>NET &middot; BALANCE &middot; PUMP</b>Phoenix-metro pool service companies &middot; greenaidigital.com</div>
    </div>
  </div>
  <div class="rule"></div>
</div></body></html>

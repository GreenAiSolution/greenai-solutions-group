<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1d1a13"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d3a3"/>
      <stop offset="1" stop-color="#b79d6a"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- ring (inside Instagram's circular crop) -->
  <circle cx="540" cy="540" r="470" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="540" cy="540" r="450" fill="none" stroke="#cdb88a" stroke-opacity=".35" stroke-width="2"/>
  <!-- ghost 89 -->
  <text x="540" y="700" text-anchor="middle" font-family="Playfair Display, Georgia, 'Times New Roman', serif" font-size="560" font-style="italic" fill="#cdb88a" fill-opacity=".07">89</text>
  <!-- shield -->
  <path d="M540 190 L710 240 V430 Q710 560 540 640 Q370 560 370 430 V240 Z" fill="#0d0c0a" stroke="url(#gold)" stroke-width="8"/>
  <path d="M540 214 L688 258 V430 Q688 544 540 614 Q392 544 392 430 V258 Z" fill="none" stroke="#cdb88a" stroke-opacity=".4" stroke-width="2"/>
  <!-- football -->
  <g transform="translate(540 400) rotate(-28)">
    <ellipse rx="112" ry="64" fill="url(#gold)"/>
    <ellipse rx="112" ry="64" fill="none" stroke="#0d0c0a" stroke-width="5"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#0d0c0a" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#0d0c0a" stroke-width="5" stroke-linecap="round">
      <line x1="-26" y1="-14" x2="-26" y2="14"/><line x1="-9" y1="-14" x2="-9" y2="14"/>
      <line x1="9" y1="-14" x2="9" y2="14"/><line x1="26" y1="-14" x2="26" y2="14"/>
    </g>
    <path d="M-84 -34 Q-96 0 -84 34 M84 -34 Q96 0 84 34" fill="none" stroke="#0d0c0a" stroke-width="5"/>
  </g>
  <text x="540" y="560" text-anchor="middle" font-family="Playfair Display, Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="url(#gold)">89</text>
  <!-- wordmark -->
  <text x="540" y="768" text-anchor="middle" font-family="Playfair Display, Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="14" fill="#f3ece0">GREEN SNAPS</text>
  <line x1="330" y1="808" x2="750" y2="808" stroke="#cdb88a" stroke-width="2"/>
  <text x="540" y="856" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" letter-spacing="9" fill="#cdb88a">LONG SNAPPING INSTRUCTION</text>
</svg>

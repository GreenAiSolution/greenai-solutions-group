    <rect x="248" y="704" width="144" height="102" rx="9" fill="none" stroke="#3FD0C3" stroke-width="2" opacity=".75"/>
    
  <g clip-path="url(#netclip)"><path d="M192 718 L250 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M250 718 L192 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M206 718 L264 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M264 718 L206 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M220 718 L278 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M278 718 L220 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M234 718 L292 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M292 718 L234 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M248 718 L306 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M306 718 L248 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M262 718 L320 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M320 718 L262 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M276 718 L334 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M334 718 L276 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M290 718 L348 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M348 718 L290 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M304 718 L362 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M362 718 L304 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M318 718 L376 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M376 718 L318 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M332 718 L390 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/><path d="M390 718 L332 776" stroke="#3FD0C3" stroke-width="1.2" opacity=".5"/></g>
  <defs><clipPath id="netclip"><rect x="256" y="712" width="128" height="64" rx="6"/></clipPath></defs>
  <circle cx="338" cy="748" r="12" fill="#3FD0C3" opacity=".3" filter="url(#glowN)"/>
  <circle cx="338" cy="748" r="6" fill="#3FD0C3"/>
  <text x="320" y="798" font-family="ui-monospace,Menlo,monospace" font-size="13"
